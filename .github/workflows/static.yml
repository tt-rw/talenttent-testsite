# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # TT-707 (28-11-2026, besluiten Ronald): elke nacht om 04:00 Nederlandse tijd
  # publiceren. GitHub plant in UTC zonder zomertijd: 02:00 UTC is 04:00 in de
  # zomer, 03:00 UTC is 04:00 in de winter. De job `tijd` laat alleen het plan
  # door dat nu 04:00 in Amsterdam is; de andere run eindigt als "skipped".
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 3 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # TT-707: bij een plan alleen door als het nu 04:00 in Amsterdam is.
  # Bij een push of Run workflow altijd door.
  tijd:
    runs-on: ubuntu-latest
    outputs:
      door: ${{ steps.toets.outputs.door }}
    steps:
      - id: toets
        env:
          PLAN: ${{ github.event.schedule }}
        run: |
          verschil=$(TZ=Europe/Amsterdam date +%z)
          door=nee
          if [ -z "$PLAN" ]; then door=ja; fi
          if [ "$PLAN" = "0 2 * * *" ] && [ "$verschil" = "+0200" ]; then door=ja; fi
          if [ "$PLAN" = "0 3 * * *" ] && [ "$verschil" = "+0100" ]; then door=ja; fi
          echo "plan: '$PLAN', Amsterdam $verschil, door: $door"
          echo "door=$door" >> "$GITHUB_OUTPUT"
  # TT-678 (22-11-2026): pakket maken en publiceren in twee aparte jobs, zoals de
  # startversie van GitHub. In één job zocht deploy-pages het pakket al een fractie
  # van een seconde na het uploaden, en dan staat het nog niet in de lijst van GitHub.
  build:
    needs: tijd
    if: needs.tijd.outputs.door == 'ja'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: '.'
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
